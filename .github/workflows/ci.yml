name: ProbeWatch CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: probewatch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node for version check
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify server and frontend versions
        shell: bash
        run: |
          server_version=$(sed -n 's/^[[:space:]]*ServerVersion[[:space:]]*= ["'"'"']\([0-9.]*\)["'"'"']$/\1/p' internal/version/version.go)
          frontend_version=$(node -p "require('./frontend/package.json').version")
          test "$server_version" = "$frontend_version"
      - name: Run Go tests
        run: go test ./...
      - name: Build server
        run: go build ./cmd/probewatch ./cmd/probewatch-agent

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build

