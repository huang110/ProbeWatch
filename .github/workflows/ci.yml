name: ProbeWatch CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probewatch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node for version check
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify server and frontend versions
        shell: bash
        run: |
          server_version=$(sed -n 's/^[[:space:]]*ServerVersion[[:space:]]*= ["'"'"']\([^"'"'"']*\)["'"'"']$/\1/p' internal/version/version.go)
          frontend_version=$(node -p "require('./frontend/package.json').version")
          test "$server_version" = "$frontend_version"
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests
        run: go test ./...
      - name: Test safe deploy rollback suite
        shell: bash
        run: bash deploy/test_safe_deploy_rollback.sh
      - name: Build server
        run: go build ./cmd/probewatch ./cmd/probewatch-agent
      - name: Validate installer script
        shell: bash
        run: |
          ! grep -n $'\r' deploy/install.sh
          cmp -s deploy/install.sh internal/deploy/install.sh
          ! grep -n -- "curl .* -k" deploy/install.sh
          ! grep -n -- "curl .* -k" internal/deploy/install.sh
          sh -n deploy/install.sh
          sh -n internal/deploy/install.sh
          sh -n deploy/prune-archives.sh

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Full toolchain audit
        run: npm audit --audit-level=high
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build
      - name: Verify frontend bundle
        run: npm run test:smoke

  mock-browser:
    name: Mock browser regression
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run mock browser regression
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx vite preview --port 4173 &
          sleep 4
          python tests/browser_live_regression.py

  real-browser:
    name: Real browser regression (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run real browser regression
        working-directory: frontend
        env:
          PROBEWATCH_REAL_BASE_URL: ${{ secrets.PROBEWATCH_REAL_BASE_URL }}
          PROBEWATCH_TEST_USERNAME: ${{ secrets.PROBEWATCH_TEST_USERNAME }}
          PROBEWATCH_TEST_PASSWORD: ${{ secrets.PROBEWATCH_TEST_PASSWORD }}
          PROBEWATCH_TEST_NODE_UUID: ${{ secrets.PROBEWATCH_TEST_NODE_UUID }}
          PROBEWATCH_EXPECT_ROLE: ${{ secrets.PROBEWATCH_EXPECT_ROLE }}
        run: python tests/browser_real_regression.py


  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, frontend]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend release asset
        working-directory: frontend
        run: |
          mkdir -p ../release
          npm ci
          npm run build
          tar -czf "../release/probewatch-frontend-${GITHUB_REF_NAME}.tar.gz" -C dist .
      - name: Build release assets
        shell: bash
        run: |
          mkdir -p release
          for target in "linux amd64" "linux arm64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "release/probewatch-server-$1-$2" ./cmd/probewatch
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "release/probewatch-agent-$1-$2" ./cmd/probewatch-agent
          done
          (cd release && sha256sum probewatch-frontend-*.tar.gz probewatch-server-* probewatch-agent-* > SHA256SUMS)
      - name: Verify release versions and assets
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          server_version=$(awk -F'"' '/ServerVersion[[:space:]]*=/{print $2; exit}' internal/version/version.go)
          frontend_version=$(node -p "require('./frontend/package.json').version")
          echo "tag=$tag_version server=$server_version frontend=$frontend_version"
          test "$tag_version" = "$server_version"
          test "$tag_version" = "$frontend_version"
          test -f "release/probewatch-server-linux-amd64"
          test -f "release/probewatch-server-linux-arm64"
          test -f "release/probewatch-agent-linux-amd64"
          test -f "release/probewatch-agent-linux-arm64"
          test -f "release/probewatch-frontend-${GITHUB_REF_NAME}.tar.gz"
          test -f release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
          grep -Fq "## v$tag_version" CHANGELOG.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
